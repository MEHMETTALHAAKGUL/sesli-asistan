<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sesli Asistan Deneyimi</title>
    <style>
        /* Modern ve Karanlık Tema */
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0f0f1a;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .hint {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Arka plan süslemesi */
        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: #4f46e5;
            filter: blur(120px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="blob"></div>

    <div class="container">
        <div class="hint">ElevenLabs Voice AI</div>
        <h1>Sesli Asistanım</h1>
        <p>Geleceğin teknolojisiyle konuşmaya başlayın. Sağ alttaki ikona tıklayarak benimle iletişime geçebilirsiniz.</p>
        <div class="hint">Konuşmak için sağ alttaki butona tıklayın</div>
    </div>
